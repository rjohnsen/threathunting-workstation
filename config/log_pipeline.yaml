apache-pipeline:
  source:
    file:
      path: "/opt/predefender/logs/access.log"
      record_type: "plain"
  processor:
    - grok:
        match:
          message: 
            - >-
              %{IPORHOST:client_ip} %{USER:ident} %{USER:auth} \[%{HTTPDATE:timestamp}\] 
              "%{WORD:method} %{URIPATHPARAM:request} HTTP/%{NUMBER:http_version}" 
              %{NUMBER:response_code} (?:%{NUMBER:bytes}|-) 
              "%{DATA:referer}" "%{DATA:user_agent}"
    - date:
        from_time_received: true
        destination: "@timestamp"
  sink:
    - opensearch:
        hosts: [ "https://opensearch-node1:9200" ]
        insecure: true
        username: "admin"
        password: "Opensearch1234!!!!"
        index: "apache_logs"
ndjson-pipeline:
  source:
    file:
      path: "/opt/predefender/logs/*.ndjson"
      record_type: "event"
      codec: newline
  processor:
    - grok:
        match:
          message: ["%{GREEDYDATA:message}"]
    - date:
        from_time_received: true
        destination: "@timestamp"
    - append:
        - from: "_source"
          to: "parsed_event"
  sink:
    - opensearch:
        hosts: [ "https://opensearch-node1:9200" ]
        insecure: true
        username: "admin"
        password: "Opensearch1234!!!!"
        index: "ndjson_logs"
